name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'swiftpay/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'swiftpay/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: swiftpay-frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'swiftpay/package-lock.json'

      - name: Install dependencies
        working-directory: swiftpay
        run: npm ci

      - name: Run ESLint
        working-directory: swiftpay
        run: npm run lint --if-present

      - name: Check code style
        working-directory: swiftpay
        run: npm run format:check --if-present

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'swiftpay/package-lock.json'

      - name: Install dependencies
        working-directory: swiftpay
        run: npm ci

      - name: TypeScript check
        working-directory: swiftpay
        run: npm run type-check --if-present

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'swiftpay/package-lock.json'

      - name: npm audit
        working-directory: swiftpay
        run: npm audit --audit-level=moderate

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'swiftpay/package-lock.json'

      - name: Install dependencies
        working-directory: swiftpay
        run: npm ci

      - name: Run tests
        working-directory: swiftpay
        run: npm test --if-present

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./swiftpay/coverage/coverage-final.json
          flags: frontend

  build:
    needs: [lint, type-check, security, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./swiftpay
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  eas-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, type-check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Expo/EAS CLI
        run: npm install -g eas-cli

      - name: Build for iOS
        working-directory: swiftpay
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: eas build --platform ios --non-interactive

      - name: Build for Android
        working-directory: swiftpay
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: eas build --platform android --non-interactive
