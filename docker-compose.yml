version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: swiftpay-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-swiftpay}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/migrations_phase2.sql:/docker-entrypoint-initdb.d/02-phase2.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swiftpay-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: swiftpay-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swiftpay-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swiftpay-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-swiftpay}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_min_32_chars}
      JWT_EXPIRES_IN: 7d
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD}
      OPEN_EXCHANGE_API_KEY: ${OPEN_EXCHANGE_API_KEY}
      FIREBASE_CONFIG_PATH: ${FIREBASE_CONFIG_PATH}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/logs:/app/logs
      - ${FIREBASE_CONFIG_PATH}:/app/config/serviceAccountKey.json:ro
    networks:
      - swiftpay-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (Expo)
  frontend:
    build:
      context: ./swiftpay
      dockerfile: Dockerfile
    container_name: swiftpay-frontend
    environment:
      REACT_APP_API_URL: http://backend:3000/api
      REACT_APP_ENVIRONMENT: ${NODE_ENV:-production}
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
    depends_on:
      - backend
    volumes:
      - ./swiftpay/src:/app/src
      - ./swiftpay/public:/app/public
    networks:
      - swiftpay-network
    restart: unless-stopped
    # Note: Expo may have issues in containers. For production, export to static build

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: swiftpay-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - swiftpay-network
    restart: unless-stopped

  # Adminer (Database Management - Development)
  adminer:
    image: adminer
    container_name: swiftpay-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - swiftpay-network
    restart: unless-stopped
    environment:
      ADMINER_DESIGN: galant

networks:
  swiftpay-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
